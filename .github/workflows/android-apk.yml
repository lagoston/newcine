# APK de teste do app Android do CineOracle, gerado pelo GitHub (sem precisar
# instalar o Android Studio). Rodar em: Actions → "App Android (APK de teste)"
# → Run workflow. No fim, o APK fica em "Artifacts" da execução.
#
# Antes da primeira vez, cadastre em Settings → Secrets and variables →
# Actions → Variables (os mesmos valores do Netlify):
#   VITE_SUPABASE_URL
#   VITE_SUPABASE_ANON_KEY
#
# O APK de teste é assinado com a chave de depuração: serve para instalar no
# celular e testar, não para a Play Store (que recebe um .aab assinado com a
# chave de upload — ver claude/app-nas-lojas.md no projeto).
#
# 20/11/2026 — a assinatura. Sem configurar nada, a chave de depuração nasce
# de novo a cada execução (a máquina do GitHub é nova a cada vez). Duas
# consequências: (1) o Android pode recusar instalar o APK novo por cima do
# antigo ("conflito de pacote"): aí é desinstalar o antigo antes; (2) os App
# Links (abrir links do site direto no app) não têm como ser verificados, porque
# a impressão digital muda a cada build. O resumo da execução mostra a
# impressão digital de cada APK: se ela mudar de um build para o outro, é isso.
#
# Para uma assinatura FIXA (opcional), cadastre em Settings → Secrets and
# variables → Actions → Secrets:
#   ANDROID_KEYSTORE_BASE64    o arquivo .jks em base64
#   ANDROID_KEYSTORE_PASSWORD  a senha do arquivo
#   ANDROID_KEY_ALIAS          o nome da chave dentro dele
#   ANDROID_KEY_PASSWORD       a senha da chave
# Com os quatro presentes, o APK sai assinado com essa chave e a impressão
# digital passa a ser sempre a mesma. Guarde uma cópia do .jks fora do GitHub:
# sem ele não dá para atualizar o app de quem já instalou.
name: App Android (APK de teste)

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
    steps:
      - name: Conferir as variáveis do Supabase
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Cadastre VITE_SUPABASE_URL e VITE_SUPABASE_ANON_KEY em Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm ci

      - name: Gerar o site e copiar para o projeto Android
        run: npx vite build && npx cap sync android

      - name: Compilar o APK
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            # assinatura fixa: a chave vem dos segredos e nunca é escrita no repositório
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/cineoracle.jks"
            ./gradlew assembleDebug --no-daemon \
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/cineoracle.jks" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
            rm -f "$RUNNER_TEMP/cineoracle.jks"
            echo "ASSINATURA=fixa" >> "$GITHUB_ENV"
          else
            ./gradlew assembleDebug --no-daemon
            echo "ASSINATURA=de depuração (muda a cada execução)" >> "$GITHUB_ENV"
          fi

      - name: Impressão digital da assinatura (no resumo da execução)
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          DIGITAL=$(keytool -printcert -jarfile "$APK" 2>/dev/null | grep -i 'SHA256:' | head -1 | sed 's/.*SHA256: *//')
          {
            echo "## Assinatura deste APK"
            echo ""
            echo "- Chave: **$ASSINATURA**"
            echo "- Impressão digital (SHA-256): \`${DIGITAL:-não consegui ler}\`"
            echo ""
            echo "Se a impressão digital mudar de um build para o outro, o Android pode recusar instalar por cima do app antigo (é preciso desinstalar antes) e os App Links não funcionam. A assinatura fixa está explicada no topo de .github/workflows/android-apk.yml."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: cineoracle-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
