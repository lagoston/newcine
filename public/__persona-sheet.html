<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Persona sheet</title>
<style>
  body { margin: 0; background: #111; color: #eee; font: 12px/1.25 system-ui, sans-serif; }
  .lab { display: flex; gap: 6px; padding: 4px; font-weight: 600; }
  .lab small { font-weight: 400; color: #aaa; }
  .grid { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 4px; }
  .t { position: relative; }
  .t img { height: 96px; display: block; border-radius: 3px; }
  .t b { position: absolute; left: 2px; top: 2px; background: #000c; color: #ff0; padding: 0 2px; font-size: 11px; border-radius: 3px; }
  .crops { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 6px; }
  .crop { aspect-ratio: 4 / 5; position: relative; overflow: hidden; border-radius: 8px; background: #222; }
  .crop img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .crop b { position: absolute; left: 3px; bottom: 3px; background: #000c; color: #ff0; padding: 1px 3px; font-size: 11px; border-radius: 3px; }
</style>
</head>
<body>
<script>
// Ferramenta interna e temporária (21/10/2026): folha de contato das imagens
// candidatas a foto de cada personagem das 84 personalidades. Some quando a
// escolha terminar. Tudo síncrono de propósito: a página fica pronta no
// primeiro desenho.
(function () {
  var KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhld2l4dmNhdG51cWZ0YWx6bXRnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDQ4MTY3NDMsImV4cCI6MjA2MDM5Mjc0M30.wK9jnuFFje_AtzqokWiuVYq2otYKW3rLPrIczw6ggFs';
  function rpc(name) {
    var x = new XMLHttpRequest();
    x.open('GET', 'https://hewixvcatnuqftalzmtg.supabase.co/rest/v1/rpc/' + name + '?apikey=' + KEY, false);
    x.send();
    return JSON.parse(x.responseText);
  }
  var q = new URLSearchParams(location.search);
  var html = '';
  if (q.has('review')) {
    var start = Number(q.get('review')) || 0;
    var all = rpc('get_personas_catalog');
    html = '<div class="crops">' + all.slice(start, start + 12).map(function (p) {
      return '<div class="crop">' + (p.character_image_path ? '<img src="https://image.tmdb.org/t/p/w500' + p.character_image_path + '" style="object-position:' + (p.character_image_focus || '50% 30%') + '">' : '') + '<b>' + p.code + '</b></div>';
    }).join('') + '</div>';
  } else {
    var i = Number(q.get('i')) || 0;
    var p = rpc('tmp_persona_candidates')[i];
    html = '<div class="lab">' + i + ' ' + p.code + '<small>' + p.ch + ' — ' + p.film + '</small></div><div class="grid">' +
      p.c.map(function (c, k) {
        return '<div class="t"><img src="https://image.tmdb.org/t/p/' + (c.k === 'p' ? 'w185' : 'w300') + c.p + '"><b>' + c.k + k + '</b></div>';
      }).join('') + '</div>';
  }
  document.write(html);
})();
</script>
</body>
</html>
