<!DOCTYPE html>
<html>
<head>
  <title>Test TMDB Fetch</title>
  <style>
    body { font-family: monospace; padding: 20px; }
    .movie { margin: 5px 0; }
    pre { background: #f5f5f5; padding: 10px; }
  </style>
</head>
<body>
  <h1>TMDB Fetch Test - Action Movies (Genre 28)</h1>
  <button onclick="fetchMovies()">Fetch 30 Action Movies</button>
  <div id="results"></div>

  <script>
    async function fetchMovies() {
      const results = document.getElementById('results');
      results.innerHTML = '<p>Loading...</p>';

      try {
        // Action genre = 28
        const response = await fetch(
          `https://api.themoviedb.org/3/discover/movie?api_key=f6b49925f72937724016c66ffc85e27e&with_genres=28&sort_by=popularity.desc&page=1&language=en-US`
        );

        const data = await response.json();
        const movies = data.results || [];

        let html = `<h2>Found ${movies.length} movies on page 1</h2>`;
        html += '<pre>';

        movies.forEach((movie, index) => {
          html += `${index + 1}. ID: ${movie.id} - ${movie.title} (${movie.release_date?.split('-')[0] || 'N/A'}) - Rating: ${movie.vote_average}\n`;
        });

        html += '</pre>';
        html += '<h3>Movie IDs Array:</h3>';
        html += `<pre>${JSON.stringify(movies.map(m => m.id), null, 2)}</pre>`;

        results.innerHTML = html;
      } catch (error) {
        results.innerHTML = `<p style="color: red">Error: ${error.message}</p>`;
      }
    }
  </script>
</body>
</html>
