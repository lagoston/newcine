<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Popular Cache de Gêneros</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background: #1a1a1a;
      color: #fff;
    }
    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      color: white;
      padding: 15px 30px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      margin: 10px 5px;
    }
    button:hover {
      opacity: 0.9;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    #status {
      background: #2a2a2a;
      padding: 20px;
      border-radius: 8px;
      margin: 20px 0;
      font-family: monospace;
      white-space: pre-wrap;
    }
    .success { color: #4ade80; }
    .error { color: #f87171; }
    .info { color: #60a5fa; }
    .warning { color: #fbbf24; }
  </style>
</head>
<body>
  <h1>🎬 Popular Cache de Gêneros - CineOracle</h1>

  <div>
    <h2>Status do Cache</h2>
    <div id="cache-status">Carregando...</div>
  </div>

  <div>
    <h2>Ações</h2>
    <button id="check-btn" onclick="checkStatus()">🔍 Verificar Status</button>
    <button id="populate-btn" onclick="populateCache()">📥 Popular Cache (TMDB)</button>
    <button id="recalculate-btn" onclick="recalculateUsers()" disabled>♻️ Recalcular Usuários</button>
  </div>

  <div id="status"></div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.39.0';

    // Configure seu Supabase
    const SUPABASE_URL = 'https://ehkewfmgpkzbmhtlzvdy.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVoa2V3Zm1ncGt6Ym1odGx6dmR5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3MTM0NjY2NTUsImV4cCI6MjAyOTA0MjY1NX0.fIJpzfd3jcMqE11hF_iT4A2PkJRV0I7OxGvjYZ45g-Y';
    const TMDB_API_KEY = '15da7a1d15ba5e2490acbad2f7394947';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    window.checkStatus = async function() {
      log('Verificando status do cache...', 'info');
      try {
        const { data, error } = await supabase.rpc('check_cache_status');
        if (error) throw error;

        const status = data;
        document.getElementById('cache-status').innerHTML = `
          <div class="info">
            <strong>Filmes avaliados:</strong> ${status.total_movies_rated}<br>
            <strong>Filmes em cache:</strong> ${status.movies_cached}<br>
            <strong>Filmes sem cache:</strong> ${status.uncached_movies}<br>
            <strong>Cobertura:</strong> ${status.cache_coverage_percent}%<br>
            <strong>Pronto para recalcular:</strong> ${status.ready_for_recalculation ? '✅ Sim' : '❌ Não'}
          </div>
        `;

        const recalcBtn = document.getElementById('recalculate-btn');
        recalcBtn.disabled = !status.ready_for_recalculation;

        log('Status obtido com sucesso!', 'success');
      } catch (error) {
        log('Erro ao verificar status: ' + error.message, 'error');
      }
    };

    window.populateCache = async function() {
      const btn = document.getElementById('populate-btn');
      btn.disabled = true;
      log('Buscando gêneros do filme 448341 no TMDB...', 'info');

      try {
        // Buscar do TMDB diretamente
        const tmdbResponse = await fetch(`https://api.themoviedb.org/3/movie/448341?api_key=${TMDB_API_KEY}`);

        if (!tmdbResponse.ok) {
          throw new Error(`TMDB API error: ${tmdbResponse.status}`);
        }

        const movie = await tmdbResponse.json();

        log(`✅ Filme encontrado: ${movie.title}`, 'success');
        log(`   Gêneros: ${movie.genres.map(g => g.name).join(', ')}`, 'info');
        log(`   Ano: ${movie.release_date?.split('-')[0] || 'N/A'}`, 'info');
        log('', 'info');
        log('Populando cache no Supabase...', 'info');

        // Popular cache via RPC
        const { data, error } = await supabase.rpc('cache_movie_genres_from_frontend', {
          p_movie_id: 448341,
          p_genres_json: movie.genres
        });

        if (error) throw error;

        log(`✅ Cache populado com sucesso!`, 'success');
        log(`   Filme ID: 448341`, 'info');
        log(`   Título: ${movie.title}`, 'info');
        log(`   Gêneros: ${movie.genres.map(g => g.name).join(', ')}`, 'success');
        log('', 'info');
        log('Agora você pode recalcular o usuário Gustavo!', 'success');

        await checkStatus();
        document.getElementById('recalculate-btn').disabled = false;

      } catch (error) {
        log('❌ Erro ao popular cache: ' + error.message, 'error');
      } finally {
        btn.disabled = false;
      }
    };

    window.recalculateUsers = async function() {
      if (!confirm('Isso vai recalcular os pontos de TODOS os usuários. Continuar?')) return;

      const btn = document.getElementById('recalculate-btn');
      btn.disabled = true;
      log('Iniciando recálculo de todos os usuários...', 'info');
      log('Isso pode levar alguns minutos. Por favor, aguarde...', 'warning');

      try {
        const { data, error } = await supabase.rpc('bulk_recalculate_all_users');
        if (error) throw error;

        log(`✅ Recálculo completo!`, 'success');
        log(`   - Total de usuários: ${data.total_users}`, 'info');
        log(`   - Sucesso: ${data.successful}`, 'success');
        log(`   - Falhas: ${data.failed}`, data.failed > 0 ? 'error' : 'info');
        log(`   - Taxa de sucesso: ${data.success_rate_percent}%`, 'success');

        await checkStatus();
      } catch (error) {
        log('Erro ao recalcular usuários: ' + error.message, 'error');
      } finally {
        btn.disabled = false;
      }
    };

    function log(message, type = 'info') {
      const status = document.getElementById('status');
      const timestamp = new Date().toLocaleTimeString();
      const className = type;
      status.innerHTML += `<div class="${className}">[${timestamp}] ${message}</div>`;
      status.scrollTop = status.scrollHeight;
    }

    // Check status on load
    window.addEventListener('load', checkStatus);
  </script>
</body>
</html>
