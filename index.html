<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/Symbal512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="description" content="CineOracle - Your personal movie companion. Discover, rate, and build your ultimate movie collection." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/assets/Symbal512.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://api.themoviedb.org" />
    <link rel="preconnect" href="https://image.tmdb.org" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <title>CineOracle</title>
    <style>
      /* CSS crítico — define a cor de fundo ANTES de qualquer JavaScript
         carregar. Sem isso, o <div id="root"> fica vazio até o React
         montar, e o navegador mostra o branco padrão nesse meio-tempo —
         é o "flash" na abertura do app, mais perceptível em modo escuro
         (branco piscando antes do tema escuro real aparecer). */
      html, body {
        background-color: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        html, body {
          background-color: #111111;
        }
      }
    </style>
    <!-- Ensure proper routing in production -->
    <script>
      // Single Page Apps for GitHub Pages/Netlify
      // MIT License https://github.com/rafgraph/spa-github-pages
      // This script checks to see if a redirect is present in the query string,
      // converts it back into the correct url and adds it to the browser's history
      // using window.history.replaceState(...), which won't cause the browser to
      // attempt to load the new url.
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
