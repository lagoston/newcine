    <!-- 18/11/2026 (otimização): conexão adiantada com o Supabase (sessão, RPCs e
         o tmdb-proxy são os primeiros pedidos da abertura). Antes havia uma para
         api.themoviedb.org, que nenhum código usa. -->
    <link rel="preconnect" href="https://hewixvcatnuqftalzmtg.supabase.co" crossorigin />
    <link rel="preconnect" href="https://image.tmdb.org" />
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <!-- Pixelify Sans: títulos da home de visitante — ecoa o letreiro em pixel
         das cartas dos oráculos. (Substitui a Cinzel, que era carregada em
         toda visita mas não era usada em nenhum lugar do código.) -->
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    <title>CineOracle</title>
    <style>
      /* CSS crítico — define a cor de fundo ANTES de qualquer JavaScript
         carregar. Sem isso, o <div id="root"> fica vazio até o React
         montar, e o navegador mostra o branco padrão nesse meio-tempo —
         é o "flash" na abertura do app, mais perceptível em modo escuro
         (branco piscando antes do tema escuro real aparecer). */
      /* Só no html (é ele que pinta a tela do navegador, inclusive a área
         que aparece ao puxar a página além do topo/fim). O body fica
         transparente para não cobrir o fundo fixo do app (PageBackground). */
      html {
        background-color: #120D22;
      }
      body {
        background-color: transparent;
      }
      /* Text Effect "Typewriter" (Customize Profile) — Courier Prime, fonte real
         de roteiro de cinema. 18/11/2026 (otimização): antes era uma folha do
         Google Fonts pedida em TODA abertura (e que travava a primeira pintura);
         agora os arquivos moram em /fonts e o navegador só baixa quando um
         texto com o efeito aparece na tela. Funciona também sem rede no app.
         Licença OFL: public/fonts/OFL-courier-prime.txt. */
      @font-face {
        font-family: 'Courier Prime';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url(/fonts/courier-prime-latin-400-normal.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Courier Prime';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url(/fonts/courier-prime-latin-700-normal.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Courier Prime';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url(/fonts/courier-prime-latin-ext-400-normal.woff2) format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: 'Courier Prime';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url(/fonts/courier-prime-latin-ext-700-normal.woff2) format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
    </style>
    <!-- Ensure proper routing in production -->
    <script>
      // Single Page Apps for GitHub Pages/Netlify
      // MIT License https://github.com/rafgraph/spa-github-pages
      // This script checks to see if a redirect is present in the query string,
      // converts it back into the correct url and adds it to the browser's history
      // using window.history.replaceState(...), which won't cause the browser to
      // attempt to load the new url.
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <!-- Cartão de compartilhamento (WhatsApp, X, Discord...). Antes apontava
         pra imagem padrão do Bolt. TROQUE o caminho relativo abaixo pela URL
         absoluta do site (ex.: https://seudominio.com/assets/og-cineoracle.jpg)
         — várias plataformas só leem og:image com URL completa. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="CineOracle">
    <meta property="og:title" content="CineOracle — tire uma carta, descubra seu próximo filme">
    <meta property="og:description" content="Três oráculos preveem o quanto você vai gostar de cada filme. Grátis.">
    <meta property="og:image" content="/assets/og-cineoracle.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="/assets/og-cineoracle.jpg">
