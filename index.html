<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/assets/Symbal512.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#120D22" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Avalie os filmes que você já viu e deixe três oráculos preverem o quanto você vai gostar do próximo. Grátis." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/assets/Symbal512.webp" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://api.themoviedb.org" />
    <link rel="preconnect" href="https://image.tmdb.org" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Pixelify Sans: títulos da home de visitante — ecoa o letreiro em pixel
         das cartas dos oráculos. (Substitui a Cinzel, que era carregada em
         toda visita mas não era usada em nenhum lugar do código.) -->
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    <!-- Text Effect "Typewriter" (Customize Profile) — fonte real de roteiro de cinema -->
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
    <title>CineOracle</title>
    <style>
      /* CSS crítico — define a cor de fundo ANTES de qualquer JavaScript
         carregar. Sem isso, o <div id="root"> fica vazio até o React
         montar, e o navegador mostra o branco padrão nesse meio-tempo —
         é o "flash" na abertura do app, mais perceptível em modo escuro
         (branco piscando antes do tema escuro real aparecer). */
      /* Só no html (é ele que pinta a tela do navegador, inclusive a área
         que aparece ao puxar a página além do topo/fim). O body fica
         transparente para não cobrir o fundo fixo do app (PageBackground). */
      html {
        background-color: #120D22;
      }
      body {
        background-color: transparent;
      }
    </style>
    <!-- Ensure proper routing in production -->
    <script>
      // Single Page Apps for GitHub Pages/Netlify
      // MIT License https://github.com/rafgraph/spa-github-pages
      // This script checks to see if a redirect is present in the query string,
      // converts it back into the correct url and adds it to the browser's history
      // using window.history.replaceState(...), which won't cause the browser to
      // attempt to load the new url.
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <!-- Cartão de compartilhamento (WhatsApp, X, Discord...). Antes apontava
         pra imagem padrão do Bolt. TROQUE o caminho relativo abaixo pela URL
         absoluta do site (ex.: https://seudominio.com/assets/og-cineoracle.jpg)
         — várias plataformas só leem og:image com URL completa. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="CineOracle">
    <meta property="og:title" content="CineOracle — tire uma carta, descubra seu próximo filme">
    <meta property="og:description" content="Três oráculos preveem o quanto você vai gostar de cada filme. Grátis.">
    <meta property="og:image" content="/assets/og-cineoracle.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="/assets/og-cineoracle.jpg">
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
